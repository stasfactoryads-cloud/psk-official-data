name: Daily data refresh

on:
  schedule:
    # 08:00 по Москве (UTC+3) = 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Fetch flats, marketing and project cards
        run: |
          python3 fetch_flats.py
          python3 fetch_marketing.py
          python3 fetch_projects.py

      - name: Build API, index and page
        run: |
          python3 build.py
          python3 write_index.py
          python3 build_html.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
